name: Release

# Trusted Publishing (OIDC) — no NPM_TOKEN secret required.
# Configure once on npmjs.com:
#   Package → Settings → Trusted Publisher → GitHub Actions
#   Owner: AndresArreguy · Repository: ecc-pi-port · Workflow: release.yml
# Then push a tag that matches package.json (e.g. v0.7.1).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@^11

      - name: Cache ECC checkout
        uses: actions/cache@v6
        with:
          path: ecc
          key: ecc-${{ hashFiles('ecc.lock') }}

      - run: npm ci

      - name: Bootstrap ECC and build
        run: npm run setup -- --skip-install

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi

      # npm publish runs prepublishOnly (verify + release-check) and prepack.
      # Authentication comes from the GitHub OIDC token (id-token: write).
      - name: Publish to npm
        run: npm publish --provenance --access public
