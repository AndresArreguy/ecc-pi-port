name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Cache ECC checkout
        uses: actions/cache@v6
        with:
          path: ecc
          key: ecc-${{ hashFiles('ecc.lock') }}

      - run: npm ci

      - name: Bootstrap ECC and build
        run: npm run setup -- --skip-install

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
