name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cache ECC checkout
        uses: actions/cache@v6
        with:
          path: ecc
          key: ecc-${{ hashFiles('ecc.lock') }}

      - run: npm ci

      - name: Bootstrap ECC and build
        run: npm run setup -- --skip-install

      - name: Release checks
        run: npm run release:check
